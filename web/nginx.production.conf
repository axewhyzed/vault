server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Accept the proxy chain only from the exact Coolify/Traefik container IP.
    # Traefik appends the socket peer last; real_ip_recursive off selects that
    # final address even if a client supplied an earlier X-Forwarded-For value.
    set_real_ip_from ${VAULT_TRAEFIK_TRUSTED_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    access_log off;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/v1/uploads/ {
        client_max_body_size 101m;
        client_body_timeout 1h;
        proxy_pass http://vault-api-backend:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ^~ /api/v1/items/ {
        client_max_body_size 101m;
        proxy_pass http://vault-api-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /api/ {
        client_max_body_size 101m;
        proxy_pass http://vault-api-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace incoming forwarding headers with the client resolved from the
        # trusted Traefik peer above; ASP.NET trusts only this Nginx container.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /health/ {
        proxy_pass http://vault-api-backend:8080/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
