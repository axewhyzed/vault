services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-local.ps1 to create .env first}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  dpkeys-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /keys && chmod 700 /keys && mkdir -p /files/staging /files/objects && chown 1654:1654 /files /files/staging /files/objects && chmod 700 /files /files/staging /files/objects && mkdir -p /maintenance && chown 1654:0 /maintenance && chmod 770 /maintenance && touch /maintenance/maintenance.lock && chown 1654:0 /maintenance/maintenance.lock && chmod 660 /maintenance/maintenance.lock"]
    volumes:
      - data_protection_keys:/keys
      - file_data:/files
      - maintenance_lock:/maintenance
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/api/Vault.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Vault: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vault};Username=${POSTGRES_USER:-vault};Password=${POSTGRES_PASSWORD:?Run ./scripts/setup-local.ps1 to create .env first}
      Database__ApplyMigrations: "true"
      Bootstrap__Email: ${VAULT_BOOTSTRAP_EMAIL:-owner@vault.local}
      Bootstrap__Username: ${VAULT_BOOTSTRAP_USERNAME:-owner}
      Bootstrap__Password: ${VAULT_BOOTSTRAP_PASSWORD:?Run ./scripts/setup-local.ps1 to create .env first}
      Bootstrap__SyncCredentials: "${VAULT_BOOTSTRAP_SYNC_CREDENTIALS:-true}"
      TrustedProxyIp: ${VAULT_PROXY_IP:-172.30.10.10}
      Security__AllowedOrigins__0: https://localhost:${VAULT_WEB_PORT:-8080}
      Security__AllowedOrigins__1: ${VAULT_LAN_ORIGIN:-}
      DataProtection__ApplicationName: Vault
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      Storage__FilesPath: /var/lib/vault/files
      Storage__MaintenanceLockPath: /run/vault-maintenance/maintenance.lock
    volumes:
      - data_protection_keys:/home/app/.aspnet/DataProtection-Keys
      - file_data:/var/lib/vault/files
      - maintenance_lock:/run/vault-maintenance
    networks:
      app_net:
        ipv4_address: ${VAULT_API_IP:-172.30.10.11}
        aliases: [vault-api-backend]
    depends_on:
      postgres:
        condition: service_healthy
      dpkeys-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "${VAULT_BIND_ADDRESS:-127.0.0.1}:${VAULT_WEB_PORT:-8080}:443"
    volumes:
      - type: bind
        source: ${VAULT_TLS_DIRECTORY:-./.local/tls}
        target: /etc/nginx/tls
        read_only: true
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      app_net:
        ipv4_address: ${VAULT_PROXY_IP:-172.30.10.10}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  data_protection_keys:
  file_data:
  maintenance_lock:

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${VAULT_NETWORK_SUBNET:-172.30.10.0/24}
