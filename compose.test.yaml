services:
  api:
    environment:
      Database__ApplyMigrations: "${VAULT_TEST_APPLY_MIGRATIONS:-false}"
      Database__MigrationOnly: "${VAULT_TEST_MIGRATION_ONLY:-false}"
      TrustedProxyIp: ${VAULT_PROXY_IP:-172.30.11.10}
    networks:
      app_net:
        ipv4_address: ${VAULT_API_IP:-172.30.11.11}
  web:
    networks:
      app_net:
        ipv4_address: ${VAULT_PROXY_IP:-172.30.11.10}
networks:
  app_net:
    ipam:
      config:
        - subnet: ${VAULT_NETWORK_SUBNET:-172.30.11.0/24}
