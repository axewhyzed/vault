name: vault

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Vault: Host=${VAULT_DB_HOST:?Set the existing private PostgreSQL container hostname};Port=${VAULT_DB_PORT:-5432};Database=${VAULT_DB_NAME:?Set the dedicated Vault database};Username=${VAULT_DB_USER:?Set the dedicated Vault database role};Password=${VAULT_DB_PASSWORD:?Set the dedicated Vault database password}
  Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-true}"
  Database__MigrationOnly: "false"
  Bootstrap__Email: ${VAULT_BOOTSTRAP_EMAIL:?Set the Vault bootstrap account email}
  Bootstrap__Username: ${VAULT_BOOTSTRAP_USERNAME:-mihir0234}
  Bootstrap__Password: ${VAULT_BOOTSTRAP_PASSWORD:?Set the Vault bootstrap account password}
  Bootstrap__SyncCredentials: "${VAULT_BOOTSTRAP_SYNC_CREDENTIALS:-true}"
  TrustedProxyIp: ${VAULT_WEB_IP:-172.31.20.10}
  Security__AllowedOrigins__0: https://${VAULT_DOMAIN:?Set the public domain for Vault}
  Security__ServerOrigin: https://${VAULT_DOMAIN:?Set the public domain for Vault}
  DataProtection__ApplicationName: Vault
  DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
  Storage__FilesPath: /var/lib/vault/files
  Storage__MaintenanceLockPath: /run/vault-maintenance/maintenance.lock
  Deployment__CommitSha: ${VAULT_DEPLOYED_COMMIT_SHA:?Set the immutable deployed commit SHA}

services:
  dpkeys-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /keys && chmod 700 /keys && mkdir -p /files/staging /files/objects && chown 1654:1654 /files /files/staging /files/objects && chmod 700 /files /files/staging /files/objects && mkdir -p /maintenance && chown 1654:0 /maintenance && chmod 770 /maintenance && touch /maintenance/maintenance.lock && chown 1654:0 /maintenance/maintenance.lock && chmod 660 /maintenance/maintenance.lock"]
    volumes:
      - vault_data_protection_keys:/keys
      - vault_file_data:/files
      - vault_maintenance_lock:/maintenance
    network_mode: none
    restart: "no"

  api:
    image: ${VAULT_API_IMAGE:-ghcr.io/axewhyzed/vault-api:latest}
    build:
      context: .
      dockerfile: src/api/Vault.Api/Dockerfile
    environment: *api-environment
    volumes:
      - vault_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
      - vault_file_data:/var/lib/vault/files
      - vault_maintenance_lock:/run/vault-maintenance
    networks:
      vault_backend:
        ipv4_address: ${VAULT_API_IP:-172.31.20.11}
        aliases: [vault-api-backend]
      coolify: {}
    expose:
      - "8080"
    depends_on:
      dpkeys-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  api-migrate:
    image: ${VAULT_API_IMAGE:-ghcr.io/axewhyzed/vault-api:latest}
    build:
      context: .
      dockerfile: src/api/Vault.Api/Dockerfile
    profiles: [migrate]
    environment:
      <<: *api-environment
      Database__ApplyMigrations: "true"
      Database__MigrationOnly: "true"
    volumes:
      - vault_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - coolify
    depends_on:
      dpkeys-init:
        condition: service_completed_successfully
    restart: "no"

  web:
    image: ${VAULT_WEB_IMAGE:-ghcr.io/axewhyzed/vault-web:latest}
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      NGINX_ENVSUBST_FILTER: ^VAULT_TRAEFIK_TRUSTED_IP$
      VAULT_TRAEFIK_TRUSTED_IP: ${VAULT_TRAEFIK_TRUSTED_IP:?Set the exact coolify-proxy container IP on the coolify network}
    networks:
      vault_backend:
        ipv4_address: ${VAULT_WEB_IP:-172.31.20.10}
      coolify: {}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  vault_data_protection_keys:
    name: vault_data_protection_keys
  vault_file_data:
    name: ${VAULT_FILE_VOLUME_NAME:-vault_file_data}
  vault_maintenance_lock:
    name: vault_maintenance_lock

networks:
  vault_backend:
    name: vault_backend
    internal: true
    ipam:
      config:
        - subnet: ${VAULT_BACKEND_SUBNET:-172.31.20.0/24}
  coolify:
    external: true
    name: coolify
