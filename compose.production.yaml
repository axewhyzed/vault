name: vault

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Vault: Host=${VAULT_DB_HOST:?Set the existing private PostgreSQL container hostname};Port=${VAULT_DB_PORT:-5432};Database=${VAULT_DB_NAME:?Set the dedicated Vault database};Username=${VAULT_DB_USER:?Set the dedicated Vault database role};Password=${VAULT_DB_PASSWORD:?Set the dedicated Vault database password}
  Database__ApplyMigrations: "false"
  Database__MigrationOnly: "false"
  Bootstrap__Email: ${VAULT_BOOTSTRAP_EMAIL:?Set the Vault bootstrap account email}
  Bootstrap__Password: ${VAULT_BOOTSTRAP_PASSWORD:?Set the Vault bootstrap account password}
  TrustedProxyIp: ${VAULT_WEB_IP:-172.31.20.10}
  Security__AllowedOrigins__0: https://${VAULT_DOMAIN:-vault.axewhyzedlabs.co.in}
  DataProtection__ApplicationName: Vault
  DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
  Deployment__CommitSha: ${VAULT_DEPLOYED_COMMIT_SHA:?Set the immutable deployed commit SHA}

services:
  dpkeys-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /keys /files && chmod 700 /keys /files"]
    volumes:
      - vault_data_protection_keys:/keys
      - vault_file_data:/files
    network_mode: none
    restart: "no"

  api:
    image: ${VAULT_API_IMAGE:-ghcr.io/axewhyzed/vault-api:latest}
    build:
      context: .
      dockerfile: src/api/Vault.Api/Dockerfile
    environment: *api-environment
    volumes:
      - vault_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
      - vault_file_data:/var/lib/vault/files
    networks:
      vault_backend:
        ipv4_address: ${VAULT_API_IP:-172.31.20.11}
        aliases: [vault-api-backend]
      coolify: {}
    depends_on:
      dpkeys-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api-migrate:
    image: ${VAULT_API_IMAGE:-ghcr.io/axewhyzed/vault-api:latest}
    build:
      context: .
      dockerfile: src/api/Vault.Api/Dockerfile
    profiles: [migrate]
    environment:
      <<: *api-environment
      Database__ApplyMigrations: "true"
      Database__MigrationOnly: "true"
    volumes:
      - vault_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - coolify
    depends_on:
      dpkeys-init:
        condition: service_completed_successfully
    restart: "no"

  web:
    image: ${VAULT_WEB_IMAGE:-ghcr.io/axewhyzed/vault-web:latest}
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      NGINX_ENVSUBST_FILTER: ^VAULT_TRAEFIK_TRUSTED_IP$
      VAULT_TRAEFIK_TRUSTED_IP: ${VAULT_TRAEFIK_TRUSTED_IP:?Set the exact coolify-proxy container IP on the coolify network}
    volumes:
      - ./infra/nginx.production.conf:/etc/nginx/templates/production.conf.template:ro
    command:
      - /bin/sh
      - -c
      - rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    networks:
      vault_backend:
        ipv4_address: ${VAULT_WEB_IP:-172.31.20.10}
      coolify: {}
    depends_on:
      api:
        condition: service_started
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.vault.rule: Host(`${VAULT_DOMAIN:-vault.axewhyzedlabs.co.in}`)
      traefik.http.routers.vault.entrypoints: https
      traefik.http.routers.vault.tls: "true"
      traefik.http.routers.vault.tls.certresolver: letsencrypt
      traefik.http.services.vault.loadbalancer.server.port: "80"
      traefik.http.middlewares.vault-redirect.redirectscheme.scheme: https
      traefik.http.routers.vault-http.rule: Host(`${VAULT_DOMAIN:-vault.axewhyzedlabs.co.in}`)
      traefik.http.routers.vault-http.entrypoints: http
      traefik.http.routers.vault-http.middlewares: vault-redirect
      traefik.http.routers.vault-http.service: vault
      traefik.http.routers.vault-http.priority: "100"
    restart: unless-stopped

volumes:
  vault_data_protection_keys:
    name: vault_data_protection_keys
  vault_file_data:
    name: vault_file_data

networks:
  vault_backend:
    name: vault_backend
    internal: true
    ipam:
      config:
        - subnet: ${VAULT_BACKEND_SUBNET:-172.31.20.0/24}
  coolify:
    external: true
    name: coolify
