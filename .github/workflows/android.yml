name: android-ci

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '!android/**.md'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '!android/**.md'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as an official GitHub Release'
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v0.1.0; optional for manual release)'
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build, test, and lint Android client
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon --console=plain -p android assembleDebug testDebugUnitTest lintDebug

      - name: Upload Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Decode Release Keystore
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) && env.KEYSTORE_PRESENT == 'true'
        env:
          KEYSTORE_PRESENT: ${{ secrets.VAULT_KEYSTORE_BASE64 != '' }}
          VAULT_KEYSTORE_BASE64: ${{ secrets.VAULT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$VAULT_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          echo "VAULT_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/keystore/release.jks" >> $GITHUB_ENV
          echo "VAULT_KEYSTORE_PASSWORD=${{ secrets.VAULT_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "VAULT_KEY_ALIAS=${{ secrets.VAULT_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "VAULT_KEY_PASSWORD=${{ secrets.VAULT_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: |
          android/gradlew --no-daemon --console=plain -p android assembleRelease

      - name: Prepare Release APK Assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk "vault-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "vault-debug-${TAG}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vault Android ${{ env.RELEASE_TAG }}
          files: |
            vault-*.apk
          generate_release_notes: true
