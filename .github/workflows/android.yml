name: android-ci

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/api/**'
      - 'tests/api/**'
      - 'web/src/PairingPanel.tsx'
      - '.github/workflows/android.yml'
      - 'scripts/test-android.ps1'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/api/**'
      - 'tests/api/**'
      - 'web/src/PairingPanel.tsx'
      - '.github/workflows/android.yml'
      - 'scripts/test-android.ps1'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build, test, and lint Android client
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon --console=plain -p android assembleDebug testDebugUnitTest lintDebug

      - name: Upload Test & Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/
